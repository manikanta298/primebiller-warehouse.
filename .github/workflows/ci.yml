name: Frontend and Backend CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and regression tests
        run: npm run test:conversion
      - name: First-admin registration form tests
        run: npm run test:first-admin
      - name: Responsive navigation tests
        run: npm run test:responsive
      - name: CA workspace tests
        run: npm run test:ca
      - name: Password OTP recovery UI tests
        run: npm run test:password-otp
      - name: Quotation, search and invoice print regression tests
        run: npm run test:quotations
      - name: Record deletion regression tests
        run: npm run test:record-delete
      - name: Install PDF inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Verify single-page original invoice PDFs
        run: node scripts/verify-invoice-pdf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-pdf-verification
          include-hidden-files: true
          path: frontend/.invoice-pdf-check/*.pdf
          if-no-files-found: ignore
      - name: Compile Vercel frontend
        run: npm run build:vercel
        env:
          NITRO_PRESET: vercel

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration-test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: migration_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pmigration-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and compile
        run: npm run build
      - name: Backend and MySQL migration tests
        run: npm test
        env:
          MYSQL_MIGRATION_TEST_URL: mysql://root:migration-test-password@127.0.0.1:3306/migration_tests

  deployment:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment and config tests
        run: npm run test:ops
