name: Frontend and Backend CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and regression tests
        run: npm run test:conversion
      - name: First-admin registration form tests
        run: npm run test:first-admin
      - name: Responsive navigation tests
        run: npm run test:responsive
      - name: Compile Vercel frontend
        run: npm run build:vercel
        env:
          NITRO_PRESET: vercel

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and compile
        run: npm run build
      - name: Registration and password recovery tests
        run: npm test

  deployment:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment and config tests
        run: npm run test:ops
